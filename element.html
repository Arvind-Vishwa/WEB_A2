<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element</title>
</head>
<body>
    <h1 style="background-color: aqua; height: 100px; margin: 100px;">Misal Pav</h1>

    <b style="background-color: orange; height: 100px; width: 300px; margin: 100px;">Chole bhature</b>

    <span style="background-color: blueviolet;" 
    >Pavvv Bhaji!</span>

    <ol style="font-size: larger;">
        <li>BMW I7</li>
        <li>Rubicon</li>
        <li>Lexus</li>
    </ol>

    <ol type="A" start="1" reversed>
        <li>Fortuner</li>
        <li>Swift</li>
        <li>WagonR</li>
    </ol>
    <ol  start="1" reversed style="font-size: larger;">
        <li>Fortuner</li>
        <li>Swift</li>
        <li>WagonR</li>
    </ol>

    <ol type="a" style="background-color: aquamarine; font-size: larger;">
        <li>HTML</li>
        <li>CSS</li>
        <li style="background-color: yellow;">JS</li>
    </ol>

    <ol type="I" style="font-size: larger;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cat</li>
        <li>Dog</li>
    </ol>
    <ol type="i" style="font-size: larger;">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>
    </ol>
</body>
</html>
