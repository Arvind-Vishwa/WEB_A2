<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table attribute</title>
</head>
<body>

    <!-- useing the attribute of cellSpacing and cellPadding , rowspan and colspan -->
    <table border="2px" cellpadding="20px" cellspacing="3px">

        <tr>
            <td rowspan="3">1</td>
            <th colspan="2">2</th>
            <!-- <td>3</td> -->
        </tr>
        <tr>
            <!-- <td>4</td> -->
            <td rowspan="">5</td>
            <td rowspan="2">6</td>
        </tr>
        <tr>
            <!-- <td>7</td> -->
            <td >8</td>
            <!-- <td>9</td> -->
        </tr>
    </table>
</body>
</html>
