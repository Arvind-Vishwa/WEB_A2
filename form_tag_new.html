<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/register" method="post">
        <label for="user1">Username</label>
        <input type="text" id="user1" name="username" placeholder="Enter username" required>
        <br><br>
    
        <label for="pass1">Password</label>
        <input type="password" id="pass1" name="password" minlength="8" required>
        <br><br>
    
        <label for="age1">Age</label>
        <input type="number" id="age1" name="age" value="18" min="1" max="120">
        <br><br>
    
        <label for="con1">Contact</label>
        <input type="tel" id="con1" name="contact" pattern="[0-9]{10}" placeholder="10-digit number">
        <br><br>
    
        <label for="mail1">Email</label>
        <input type="email" id="mail1" name="email" required>
        <br><br>
    
        <label for="dob1">DOB</label>
        <input type="date" id="dob1" name="dob">
        <br><br>
    
        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="male"> Male</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </fieldset>
        <br>
    
        <button type="submit">Submit</button>
    </form>


    <form action="/apply" method="post" enctype="multipart/form-data">

        <!-- ===== Personal details ===== -->
        <fieldset>
            <legend>Personal Details</legend>
    
            <label for="user2">Username</label>
            <input type="text" id="user2" name="username" required>
            <br><br>
    
            <label for="pass2">Password</label>
            <input type="password" id="pass2" name="password" minlength="8" required>
            <br><br>
    
            <label for="con2">Contact</label>
            <input type="tel" id="con2" name="contact" pattern="[0-9]{10}">
            <br><br>
    
            <label for="age2">Age</label>
            <input type="number" id="age2" name="age" value="18" min="1" max="120">
        </fieldset>
        <br>
    
        <!-- ===== Skills (checkbox group) ===== -->
        <fieldset>
            <legend>Skills</legend>
            <label><input type="checkbox" name="skills" value="web"> Web</label>
            <label><input type="checkbox" name="skills" value="sql"> SQL</label>
        </fieldset>
        <br>
    
        <!-- ===== Simple select ===== -->
        <label for="city">City</label>
        <select id="city" name="city" required>
            <option value="" disabled selected>Choose city</option>
            <option value="pune">Pune</option>
            <option value="nashik">Nashik</option>
            <option value="mumbai">Mumbai</option>
            <option value="beed">Beed</option>
            <option value="other">Other</option>
        </select>
        <br><br>
    
        <!-- ===== Select with optgroup, inside fieldset ===== -->
        <fieldset>
            <legend>From</legend>
    
            <label for="from">Location</label>
            <select id="from" name="from" required>
                <option value="" disabled selected>Choose option</option>
    
                <optgroup label="City">
                    <option value="pune">Pune</option>
                    <option value="mumbai">Mumbai</option>
                    <option value="nagpur">Nagpur</option>
                </optgroup>
    
                <optgroup label="Country">
                    <option value="india">India</option>
                    <option value="russia">Russia</option>
                    <option value="japan">Japan</option>
                </optgroup>
            </select>
            <br><br>
    
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" cols="30"></textarea>
            <br><br>
    
            <label for="color">Favourite colour</label>
            <input type="color" id="color" name="color">
            <br><br>
    
            <label for="photo">Upload photo</label>
            <input type="file" id="photo" name="photo">
            <br><br>
    
            <label for="month">Joining month</label>
            <input type="month" id="month" name="month">
            <br><br>
    
            <label for="search">Search</label>
            <input type="search" id="search" name="search">
        </fieldset>
        <br>
    
        <button type="submit">Submit</button>
    </form>
</body>
</html>
