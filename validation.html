<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
</head>
<body>
    <form action="">
        <input type="text" name="username" placeholder="username">
        <br><br>
        <input type="text" readonly value="Arvind">
        <br><br>
        <input type="text" required>
        <br><br>
        <input type="text" disabled>
        <br><br>
        <input type="tel" maxlength="10" minlength="10">
        <br><br>
        <input type="date" max="2026-10-27" min="2026-10-12"> 
        <br><br>
        <input type="checkbox" checked>SQL
        <input type="checkbox" >JAVA
        <input type="checkbox">Python
        <br><br>
        <input type="text" autofocus>
        <br><br>
        <input type="text" size="100">
        <br><br>
        <input type="number" step="10"> 
        <br><br>
        <input type="password" pattern="[A-Za-z0-9@#$]{8}" placeholder="Enter a Password">
        <br><br>
        <button>Submit</button>
    </form>

    <form action="" novalidate>

    </form>
</body>
</html>
