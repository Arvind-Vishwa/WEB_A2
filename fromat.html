<!-- format tag -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    
    <p>Positive</p>
<!-- bold -->
    <b>Positive</b>
    <br>
    <!-- strong   it gives some extra infomation to developer-->
     <strong>Chole Batura</strong>
    <br>
    <!-- i italic{but not used much} -->
     <i>Biryani</i>
     <br>
     <!-- em tag used for italic emphasize -->
      <em>Sushi</em>
      <br>
      <!-- inser tag with underline  (popular)-->
       <ins>Butter Chicken</ins>
       <u>Noodles</u>

        <br>
        <!-- superscript power -->
        <h1>H<sub>2</sub>O</h1>
        <!-- subscript  -->
        <h1>a<sup>2</sup>+b<sup>2</sup></h1>

        <br>
        <!-- mark is to highligh -->
        <mark>Pizza</mark>

        <br>
        <!-- q tag is to give a quotation -->
         <q>The magic you are looking for is in the work you avoiding it</q>

         <br>
         <!-- Strike it make line in middle -->
        <strike>Rest in peace</strike>

        <br>
        <!-- center tag -->
        <center>Center</center>

        <br>
        <h1><marquee behaviour="" direction="" scrollamout=""
            >Marquee</marquee></h1>

        <br>

        <!-- task -->
        <h1><q>A <strike>negative</strike> <ins>mind</ins> will never <em>give you </em>a<mark> positive</mark> life</q></h1>
        <br>
        <!-- marquee tag used for motion -->
        <marquee style="font-size: 50px;" behaviour="alternate" direction="" scrollamout="40">TriupmSpeed400</marquee>

        <marquee behaviour="" style="background-color: white; height: 250px;" direction="up" scrollamout="50">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZmtB9FCBT-ZsdAWGw1kO5h2MmtJC1t94cq-toXtywNQ&s" alt="" height="200">
        </marquee>

        <marquee behaviour="alternate" direction="up" scrollamount="70" style="background-color: white; height: 400px;">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBQssa2KldSmuWo9qnPRHMLK5yOzolpRdoh5ZP7fEO7w&s=10" alt="" height="200">
        </marquee>
 </body>
 </html>
