<head>

    <link rel="stylesheet" href="./ht.css">

</head>
<style>
    h1{
        color:black;background-color: plum;padding: 40px;
        width:250px;border:solid;
    }

<body>

    <!-- priority -->
    <!-- inline css > internal css > external css -->

    <!-- prefere external css -->  
    
    <!-- inline css -->
    <h1 style="color: red; background-color: black; padding: 40px; width:250px; border:solid">Chandana Mam..</h1>

    <!-- internal css -->
    <h1>Rohit sir..</h1>

    <!-- External css -->
    <h2>Anusha Mam..</h2>
</body>
</html>
